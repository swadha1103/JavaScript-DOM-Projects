<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    </head>

<body>
    <nav class="bg-warning p-3 fg-white">
       <h2>TimeFlow</h2>
    </nav>
    <section class="fluid-container animate__animated animate__backInDown" id="mainEle" >
        <div class="row">
            <div class="card col-4 m-auto mt-5 p-4 text-center">
                <h3 class="bg-info card-title p-2 text-center">Stop Watch</h3>
                <div>
                   <span class="fs-2xl" id="min">00 </span> <span class="fs-2xl">:</span>
                   <span class="fs-2xl" id="sec">00 </span><span class="fs-2xl">:</span>
                   <span class="fs-2xl" id="ms">000</span>
                   <br> <br>

                   <button class="btn bg-success" id="startBtn">Start</button>
                   <button class="btn bg-danger" id="stopBtn">Stop</button>
                   <button class="btn bg-warning" id="resetBtn">Reset</button>
                </div>
            </div>
        </div>
    </section>
    <script>
        let startBtn = document.getElementById("startBtn")
        let stopBtn = document.getElementById("stopBtn")
        let resetBtn = document.getElementById("resetBtn")

        let min = document.getElementById("min")
        let sec = document.getElementById("sec")
        let ms = document.getElementById("ms")

        let minutes=0
        let seconds=0
        let milliSec=0

        function timer(){
            milliSec += 10
            if(milliSec == 1000){
                seconds +=1
                milliSec =0
            }
            if(seconds==60){
                minutes +=1
                seconds = 0
            }

            ms.innerText = concatZero(milliSec) 
            sec.innerHTML = concatZero(seconds)
            min.innerHTML = concatZero(minutes)
        }

        function concatZero(time){
            if (time <=9){
                return "0" + time
            }else{
                return time
            }
        }
        let flag = true
        let interval = null
        startBtn.addEventListener("click",()=>{
            if(flag == true){
                interval= setInterval(timer , 10)
                flag = false
            }
        })
        stopBtn.addEventListener("click" , ()=>{
            clearInterval(interval)
            flag = true

        })

        resetBtn.addEventListener("click" , ()=>{
            clearInterval(interval)
            flag=true

            minutes=0
            seconds=0
            milliSec=0

            min.innerText="00"
            sec.innerText="00"
            ms.innerText="00"
        })
    </script>
</body>

</html>
